<link href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,100..900&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#e6eaef;--ink:#0f1624;--dim:#0f162494;--line:#0f162430;--acc:#ff4a1c;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1017;--ink:#e6eaef;--dim:#e6eaef8f;--line:#e6eaef2e;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Instrument Sans",system-ui,sans-serif;min-height:100svh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(420px circle at var(--mx,50%) var(--my,60%),color-mix(in srgb,var(--acc) 14%,transparent),transparent 70%)}
main{position:relative;min-height:100svh;max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:1.6rem;padding:1.1rem 1.25rem 1.2rem}
.top{display:flex;justify-content:space-between;align-items:center;font-size:.92rem}
.top .me{font-weight:500}
.top .loc{display:flex;align-items:center;gap:.5rem;color:var(--dim);font-variant-numeric:tabular-nums}
.top i{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 0 var(--acc);animation:ping 2.4s ease-out infinite}
@keyframes ping{70%,100%{box-shadow:0 0 0 9px transparent}}
h1{margin:.6rem 0 0;font-family:Anybody,sans-serif;font-weight:600;font-variation-settings:"wdth" 80,"wght" 600;font-size:clamp(1.7rem,6.4vw,2.7rem);line-height:1.04;letter-spacing:-.01em;max-width:17em}
.lede{margin:.5rem 0 0;color:var(--dim);max-width:30em;line-height:1.45}
.mid{margin-top:clamp(1rem, 2.8vh, 1.8rem)}
.mail{display:block;color:var(--ink);text-decoration:none;white-space:nowrap;line-height:.88;touch-action:none;user-select:none;-webkit-user-select:none;font-family:Anybody,sans-serif;font-variation-settings:"wdth" 60,"wght" 220;outline-offset:8px}
.mail .ln{display:block}
.mail .c{display:inline-block}
.copy{all:unset;cursor:pointer;margin-top:1rem;font-size:.9rem;color:var(--dim);text-decoration:underline;text-underline-offset:4px;padding:.4rem 0}
.copy:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.links{display:grid;gap:0 3rem;border-bottom:1px solid var(--line)}
.links a{position:relative;display:flex;justify-content:space-between;align-items:baseline;gap:1rem;color:var(--ink);text-decoration:none;border-top:1px solid var(--line);padding:1.05rem 0;font-family:Anybody,sans-serif;font-variation-settings:"wdth" 85,"wght" 500;font-size:clamp(1.3rem,5.4vw,1.9rem)}
.links a small{font-family:"Instrument Sans",sans-serif;font-size:.9rem;color:var(--dim);font-variation-settings:normal}
.links a::after{content:"";position:absolute;left:0;top:-1px;height:2px;width:100%;background:var(--acc);transform:scaleX(0);transform-origin:left;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.links a:hover::after,.links a:active::after,.links a:focus-visible::after{transform:scaleX(1)}
.links a:focus-visible{outline:none}
.foot{margin-top:auto;display:flex;flex-wrap:wrap;align-items:center;gap:.1rem 1.2rem;font-size:.92rem}
.foot a{color:var(--ink);text-underline-offset:4px;padding:.5rem 0}
.foot .cv{margin-right:auto;border:1px solid var(--ink);border-radius:999px;padding:.55rem 1.1rem;text-decoration:none;font-weight:500;transition:background .2s,color .2s}
.foot .cv:hover,.foot .cv:active{background:var(--ink);color:var(--bg)}
@media (min-width:760px){
  main{padding:1.8rem 3rem 2rem;gap:2.2rem}
  .links{grid-template-columns:1fr 1fr}
  .links a{font-size:clamp(1.5rem,2.4vw,2.1rem)}
}
@media (prefers-reduced-motion:reduce){.top i{animation:none}.links a::after{transition:none}}
</style>
</head>
<body>
<main>

<script>
(function(){
  var calm=matchMedia('(prefers-reduced-motion:reduce)').matches,root=document.documentElement;
  function clock(){try{document.getElementById('clk').textContent=new Intl.DateTimeFormat('en-GB',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Kolkata'}).format(new Date())}catch(e){}}
  clock();setInterval(clock,30000);
  var cp=document.getElementById('cp');
  cp.addEventListener('click',function(){try{navigator.clipboard.writeText('devak9391@gmail.com')}catch(e){}cp.textContent='Copied';setTimeout(function(){cp.textContent='Copy address'},1500)});

  var mail=document.getElementById('mail'),L=[],lines=mail.querySelectorAll('.ln');
  lines.forEach(function(ln){var s=ln.textContent;ln.textContent='';ln.setAttribute('aria-hidden','true');
    s.split('').forEach(function(ch){var c=document.createElement('span');c.className='c';c.textContent=ch;ln.appendChild(c);L.push({el:c,t:0,s:''})})});
  var W0=60,W1=112,H0=220,H1=900;
  function set(l,t){var w=Math.round((W0+(W1-W0)*t)*10)/10,h=Math.round(H0+(H1-H0)*t),s='"wdth" '+w+',"wght" '+h;if(s!==l.s){l.s=s;l.el.style.fontVariationSettings=s}}
  function fit(){
    var avail=mail.parentNode.clientWidth;mail.style.fontSize='100px';
    L.forEach(function(l){set(l,1)});
    var mx=0;lines.forEach(function(ln){mx=Math.max(mx,ln.scrollWidth)});
    mail.style.fontSize=Math.max(24,Math.floor(100*avail/mx*.985))+'px';
    L.forEach(function(l){l.s='';set(l,l.t)});
  }
  fit();addEventListener('resize',fit);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);

  var px=null,py=null,rel=0;
  function move(e){px=e.clientX;py=e.clientY;root.style.setProperty('--mx',px+'px');root.style.setProperty('--my',py+'px');clearTimeout(rel);if(e.pointerType==='touch')rel=setTimeout(function(){px=null},900)}
  addEventListener('pointermove',move);addEventListener('pointerdown',move);
  document.addEventListener('pointerleave',function(){px=null});
  function frame(ms){
    var time=ms/1000,fs=parseFloat(mail.style.fontSize)||60,R=Math.max(120,fs*2.2);
    L.forEach(function(l,i){
      var tp=0;
      if(px!==null){var r=l.el.getBoundingClientRect(),d=Math.hypot(px-(r.left+r.width/2),py-(r.top+r.height/2));tp=Math.pow(Math.max(0,1-d/R),1.6)}
      var ti=calm?.12:.1+.3*(.5+.5*Math.sin(time*1.3-i*.5));
      l.t+=(Math.max(tp,ti)-l.t)*.14;set(l,l.t);
    });
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
